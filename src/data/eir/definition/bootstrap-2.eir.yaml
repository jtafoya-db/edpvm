# The built-in EIR definition `bootstrap-2` (#217): EDP's "Employee Identity
# Record (EIR)" form as data. The questions are the bootstrap definition's
# (`bootstrap.eir.yaml`, form 1.3); what changes is that every rule is
# `blocking`. An answer that doesn't meet a rule
# stops the PDF from being generated or uploaded, and the screen says what to
# go do (each rule's `guidance`). Answers that meet every rule never wait on a
# validator for rule reasons.
#
# The app parses this as plain data (YAML 1.2 core schema) and refuses
# anchors, aliases, merge keys, tags, environment-style `${...}` values and
# any key it doesn't know (`load.ts`). Screens and rules only ever see the
# typed definition it becomes.
#
# The rule set, its values and its wording are a non-production MVP default
# pending Safeguards (#148): the guidance is marked "[Placeholder wording]"
# until Safeguards supplies it. Safeguards can publish any disposition per
# rule (#201) without a code change. This file doesn't authorize automatic
# validity or FTI use.
#
# A definition names no version of its own (#224): the server numbers each
# published version 1, 2, 3…. This file is the built-in definition
# `bootstrap-2` (version 0), which no publish can take, and it's what new EIR
# drafts use while no published version is active. The bootstrap definition
# (`bootstrap`) stays loaded: drafts and EIRs given under it, or under its old
# form version 1.3, keep its rules and labels.
validityDays: 365
reviewSlaBusinessDays: 3

form:
  title: Enterprise Data Platform - Employee Identity Record (EIR)
  intro: EDP will use this document and the answers you provide to establish your identity, and to align you and any access requests you submit.
  trainingRule: "Training is yearly: each date should be within the year before the day the form is checked, and not in the future."
  sections:
    - id: user
      title: User details
      help: Your identity at the IRS. We filled in what we could from your sign-in.
      fields:
        - id: userId
          label: User ID
          type: text
          required: true
          help: Your IRS user ID (SEID), not your Databricks account ID.
          maxLength: 12
          size: short
        - id: firstName
          label: First name
          type: text
          required: true
          prefill: first-name
        - id: lastName
          label: Last name
          type: text
          required: true
          prefill: last-name
        - id: workEmail
          label: Work email
          type: email
          required: true
          prefill: email
        - id: team
          label: Team or project
          type: text
          required: true
        - id: subTeam
          label: Sub-team or sub-project
          type: text
          required: false
        - id: contractingCompany
          label: Contracting company
          type: text
          required: false
          help: Leave blank if you aren't a contractor.
      layout:
        - rows:
            - [userId]
            - [firstName, lastName]
            - [workEmail]
            - [team, subTeam]
            - [contractingCompany]
    - id: manager
      title: Your manager
      help: "Your current manager: an IRS full-time employee who can confirm your identity."
      fields:
        - id: managerFirstName
          label: Manager's first name
          type: text
          required: true
        - id: managerLastName
          label: Manager's last name
          type: text
          required: true
        - id: managerId
          label: Manager's user ID
          type: text
          required: true
          maxLength: 12
          size: short
        - id: managerEmail
          label: Manager's work email
          type: email
          required: true
      layout:
        - rows:
            - [managerFirstName, managerLastName]
            - [managerId, managerEmail]
    - id: compliance
      title: Compliance
      help: Checked before you can download the PDF to sign. If an answer doesn't meet a rule, the form says what to do first.
      fields:
        - id: unauthorizedAccessTrainingDate
          label: Unauthorized Access training date
          type: date
          required: true
          size: short
        - id: privacyTrainingDate
          label: Privacy training date
          type: date
          required: true
          size: short
        - id: cyberAwarenessTrainingDate
          label: Cyber Awareness training date
          type: date
          required: true
          size: short
        - id: irmAcknowledged
          label: Have you read, acknowledged and signed the IRM 10.5.8 manual transmittal?
          type: yes-no
          required: true
        - id: ndaSigned
          label: Have you agreed to and signed the IRS non-disclosure agreement (NDA)?
          type: yes-no
          required: true
        - id: mbiInitialDate
          label: MBI or staff-like access start date
          type: date
          required: true
          size: short
        - id: mbiExpirationDate
          label: MBI or staff-like access expiration date
          type: date
          required: true
          size: short
        - id: mbiPreliminary
          label: Does your MBI or staff-like access show a preliminary or incomplete background investigation?
          type: yes-no
          required: true
      layout:
        - legend: Training certificates
          hint: "Training is yearly: each date should be within the year before the day the form is checked, and not in the future."
          rows:
            - [unauthorizedAccessTrainingDate, privacyTrainingDate, cyberAwarenessTrainingDate]
        - rows:
            - [irmAcknowledged]
            - [ndaSigned]
        - legend: MBI or staff-like access
          hint: From your MBI or staff-like access record.
          rows:
            - [mbiInitialDate, mbiExpirationDate]
            - [mbiPreliminary]
  declaration:
    text: I hereby declare that the information submitted is accurate and complete to the best of my knowledge. I understand that any false statement, omission, or misrepresentation may result in disciplinary action and could lead to the suspension or revocation of any access, entitlements, or permissions granted based on this submission.
    attestation:
      id: declarationAgreed
      label: I agree

# How far back a certificate may be dated. `anchor: evaluated` counts back
# from the day the form is checked (UTC): no more than `max` units before it
# and no less than `min` units before it, both ends included. (`form-started`,
# the default when `anchor` is left out, counts `max` back from the day the
# form was started instead, as the bootstrap definition does.) `unit` is years, months or days.
timelines:
  - id: training-certificate
    anchor: evaluated
    unit: years
    min: 0
    max: 1

# Each rule checks one field; a field can have more than one rule. Every rule
# here is `blocking`. `guidance` is what the employee is told to go do.
# `not-past` is a date that isn't before the day it's checked (an MBI that has
# already expired), on the same evaluation clock as the other date rules.
rules:
  - id: user-id-format
    field: userId
    operator: irs-id
    disposition: blocking
    reasonCode: EIR-USER-ID-FORMAT
    guidance: "[Placeholder wording] Enter your IRS user ID (SEID): 3 to 12 letters and numbers, like A1B2C."
  - id: manager-id-format
    field: managerId
    operator: irs-id
    disposition: blocking
    reasonCode: EIR-MANAGER-ID-FORMAT
    guidance: "[Placeholder wording] Enter your manager's IRS user ID (SEID): 3 to 12 letters and numbers, like A1B2C."
  - id: unauthorized-access-training-current
    field: unauthorizedAccessTrainingDate
    operator: within-timeline
    timeline: training-certificate
    disposition: blocking
    reasonCode: EIR-UA-TRAINING-NOT-CURRENT
    guidance: "[Placeholder wording] Complete your Unauthorized Access training, then enter its completion date."
  - id: privacy-training-current
    field: privacyTrainingDate
    operator: within-timeline
    timeline: training-certificate
    disposition: blocking
    reasonCode: EIR-PRIVACY-TRAINING-NOT-CURRENT
    guidance: "[Placeholder wording] Complete your Privacy training, then enter its completion date."
  - id: cyber-awareness-training-current
    field: cyberAwarenessTrainingDate
    operator: within-timeline
    timeline: training-certificate
    disposition: blocking
    reasonCode: EIR-CYBER-TRAINING-NOT-CURRENT
    guidance: "[Placeholder wording] Complete your Cyber Awareness training, then enter its completion date."
  - id: irm-acknowledged
    field: irmAcknowledged
    operator: equals
    value: "no"
    message: IRM 10.5.8 not acknowledged
    disposition: blocking
    reasonCode: EIR-IRM-NOT-ACKNOWLEDGED
    guidance: "[Placeholder wording] Read, acknowledge and sign the IRM 10.5.8 manual transmittal, then answer Yes."
  - id: nda-signed
    field: ndaSigned
    operator: equals
    value: "no"
    message: IRS NDA not signed
    disposition: blocking
    reasonCode: EIR-NDA-NOT-SIGNED
    guidance: "[Placeholder wording] Sign the IRS NDA, then answer Yes."
  - id: mbi-start-not-future
    field: mbiInitialDate
    operator: not-future
    disposition: blocking
    reasonCode: EIR-MBI-START-IN-FUTURE
    guidance: "[Placeholder wording] Enter the start date shown on your MBI or staff-like access record. It can't be in the future."
  - id: mbi-expiration-after-start
    field: mbiExpirationDate
    operator: on-or-after
    otherField: mbiInitialDate
    disposition: blocking
    reasonCode: EIR-MBI-EXPIRES-BEFORE-START
    guidance: "[Placeholder wording] Check your MBI or staff-like access record: enter its expiration date, which is after the start date."
  - id: mbi-not-expired
    field: mbiExpirationDate
    operator: not-past
    disposition: blocking
    reasonCode: EIR-MBI-EXPIRED
    guidance: "[Placeholder wording] Your MBI or staff-like access has expired. Renew it, then enter the new expiration date."
  - id: mbi-investigation-complete
    field: mbiPreliminary
    operator: equals
    value: "yes"
    message: Preliminary or incomplete background investigation
    disposition: blocking
    reasonCode: EIR-MBI-PRELIMINARY
    guidance: "[Placeholder wording] Wait until your background investigation is complete, then answer No."

# Synthetic answers (no real person) and the outcome each must produce: pass,
# then one blocking scenario per rule with the reason code it must give. A
# scenario may start from an earlier one's answers (`extends`) and change some.
scenarios:
  - id: pass
    expect: pass
    formStartedAt: "2026-09-01"
    submittedAt: "2026-09-02"
    answers:
      userId: TST0001
      firstName: Test
      lastName: Person
      workEmail: test.person@example.gov
      team: Synthetic Team
      subTeam: ""
      contractingCompany: ""
      managerFirstName: Sample
      managerLastName: Manager
      managerId: TST0002
      managerEmail: sample.manager@example.gov
      unauthorizedAccessTrainingDate: "2026-03-01"
      privacyTrainingDate: "2026-03-01"
      cyberAwarenessTrainingDate: "2026-03-01"
      irmAcknowledged: "yes"
      ndaSigned: "yes"
      mbiInitialDate: "2025-01-15"
      mbiExpirationDate: "2030-01-15"
      mbiPreliminary: "no"
      declarationAgreed: "yes"
  - id: blocking-user-id
    expect: blocking
    extends: pass
    reasonCode: EIR-USER-ID-FORMAT
    answers:
      userId: not an id!
  - id: blocking-manager-id
    expect: blocking
    extends: pass
    reasonCode: EIR-MANAGER-ID-FORMAT
    answers:
      managerId: not an id!
  - id: blocking-ua-training
    expect: blocking
    extends: pass
    reasonCode: EIR-UA-TRAINING-NOT-CURRENT
    answers:
      unauthorizedAccessTrainingDate: "2025-08-01"
  - id: blocking-privacy-training
    expect: blocking
    extends: pass
    reasonCode: EIR-PRIVACY-TRAINING-NOT-CURRENT
    answers:
      privacyTrainingDate: "2025-08-01"
  - id: blocking-cyber-training
    expect: blocking
    extends: pass
    reasonCode: EIR-CYBER-TRAINING-NOT-CURRENT
    answers:
      cyberAwarenessTrainingDate: "2025-08-01"
  - id: blocking-irm
    expect: blocking
    extends: pass
    reasonCode: EIR-IRM-NOT-ACKNOWLEDGED
    answers:
      irmAcknowledged: "no"
  - id: blocking-nda
    expect: blocking
    extends: pass
    reasonCode: EIR-NDA-NOT-SIGNED
    answers:
      ndaSigned: "no"
  - id: blocking-mbi-start-future
    expect: blocking
    extends: pass
    reasonCode: EIR-MBI-START-IN-FUTURE
    answers:
      mbiInitialDate: "2026-12-01"
  - id: blocking-mbi-expires-before-start
    expect: blocking
    extends: pass
    reasonCode: EIR-MBI-EXPIRES-BEFORE-START
    answers:
      mbiExpirationDate: "2024-01-15"
  - id: blocking-mbi-expired
    expect: blocking
    extends: pass
    reasonCode: EIR-MBI-EXPIRED
    answers:
      mbiExpirationDate: "2026-09-01"
  - id: blocking-mbi-preliminary
    expect: blocking
    extends: pass
    reasonCode: EIR-MBI-PRELIMINARY
    answers:
      mbiPreliminary: "yes"
