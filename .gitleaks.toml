title = "EDP Vending Machine public release"

[extend]
useDefault = true

[[allowlists]]
description = "UUID-shaped idempotency and record identifiers are not credentials"
targetRules = ["generic-api-key"]
regexes = [
  '''(?i)\b[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\b''',
]
